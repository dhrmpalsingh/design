<body>
<div id="stage"><canvas id="gl"></canvas><svg id="ov" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280"></svg></div>
<script src="vo.js"></script>
<script type="module">
// ---------------------------------------------------------------------------
// What if you could take an elevator to space? A 3D explainer in five "sets":
//   OCEAN  (metres)  the equator platform, sea and sky
//   SPACE  (1 unit = 637.1 km, Earth radius 10) Earth, orbit, cable, counterweight
//   ASCENT (metres, climber at the origin, Earth far below) the ride up
//   LAB    (metres) cables snapping, graphene rolling into a nanotube, the ruler
//   CABIN  (metres) inside the climber as weight fades away
// Each scene is one narration line (vo.js); actions sit at fractions of a scene.
// ---------------------------------------------------------------------------
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
await document.fonts.load('700 60px Fredoka');

const QP = new URLSearchParams(location.search);
const RES = +(QP.get('res') || 720), PXW = RES, PXH = Math.round(RES * 16 / 9);

// ---------- math + timeline ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => b <= a ? (t >= b ? 1 : 0) : clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = x => 1 - Math.pow(1 - x, 3), easeIn = x => x * x * x;
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const VO = window.VO || [];
const S = []; let acc = .35;
VO.forEach(l => { S.push(acc); acc += l.dur + .25 + l.extra; });
const VDUR = acc + .1, SE = i => (i + 1 < S.length ? S[i + 1] : VDUR), T = (i, f = 0) => S[i] + f * (SE(i) - S[i]);
const P = (t, i, a, b) => prog(t, T(i, a), T(i, b));
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------- renderer ----------
const canvas = document.getElementById('gl');
canvas.width = PXW; canvas.height = PXH; canvas.style.width = PXW + 'px'; canvas.style.height = PXH + 'px';
{ const st = document.getElementById('stage'), o = document.getElementById('ov'); st.style.width = PXW + 'px'; st.style.height = PXH + 'px'; o.setAttribute('width', PXW); o.setAttribute('height', PXH); }
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(PXW, PXH, false);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .9;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), .04).texture;
const camera = new THREE.PerspectiveCamera(40, PXW / PXH, .05, 2e10);
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(PXW, PXH, { type: THREE.HalfFloatType, samples: 4 }));
composer.setSize(PXW, PXH);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(PXW, PXH), .55, .55, .92); composer.addPass(bloom);
composer.addPass(new OutputPass());
const U = { time: { value: 0 } };

// ---------- shared GLSL ----------
const NOISE = `
float h3(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
float vn(vec3 x) { vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p, int oct) { float a = .5, s = 0.; for (int i = 0; i < 11; i++) { if (i >= oct) break; s += a * vn(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return s; }`;
const LOGV = ['#include <common>\n#include <logdepthbuf_pars_vertex>\n', '\n#include <logdepthbuf_vertex>\n'];
const LOGF = ['#include <common>\n#include <logdepthbuf_pars_fragment>\n', '\n#include <logdepthbuf_fragment>\n'];
const SUN_SPACE = V3(-.55, .25, .8).normalize();

// ---------- procedural Earth (shared by SPACE, ASCENT and CABIN) ----------
function earthMaterials() {
  const uni = { uSun: { value: SUN_SPACE.clone() }, uTime: U.time, uNight: { value: 1 }, uOct: { value: 9 } };
  const surf = new THREE.ShaderMaterial({ uniforms: uni,
    vertexShader: `${LOGV[0]}\nvarying vec3 vP; varying vec3 vN; varying vec3 vW;
      void main(){ vP = position; vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; ${LOGV[1]} }`,
    fragmentShader: `${LOGF[0]}\n${NOISE}\nuniform vec3 uSun; uniform float uNight; uniform int uOct; varying vec3 vP; varying vec3 vN; varying vec3 vW;
      void main(){ ${LOGF[1]}
        vec3 p = normalize(vP); float c = fbm(p * 1.7 + vec3(3.1, 1.2, 7.7), uOct); float land = smoothstep(.505, .513, c);
        float lat = abs(p.x); float d2 = fbm(p * 6. + 11., 6);
        vec3 ocean = mix(vec3(.008, .05, .16), vec3(.025, .17, .34), smoothstep(.36, .505, c));
        vec3 green = mix(vec3(.09, .18, .07), vec3(.25, .3, .12), d2);
        float dry = smoothstep(.45, .66, fbm(p * 3. + 5., 5)) * (1. - smoothstep(.25, .6, lat));
        vec3 lc = mix(green, vec3(.55, .45, .28), dry); lc = mix(lc, vec3(.38, .35, .32), smoothstep(.6, .7, c));
        vec3 col = mix(ocean, lc, land);
        float ice = smoothstep(.8, .86, lat + (d2 - .5) * .1); col = mix(col, vec3(.88, .92, .98), ice);
        vec3 n = normalize(vN), v = normalize(cameraPosition - vW); float ndl = dot(n, uSun);
        float lit = smoothstep(-.06, .3, ndl); vec3 o = col * (lit * 1.35 + .01);
        vec3 hh = normalize(uSun + v); o += vec3(1., .93, .8) * pow(max(dot(n, hh), 0.), 70.) * (1. - land) * (1. - ice) * lit * .9;
        float city = step(.8, vn(p * 300.)) * step(.55, vn(p * 45.)) * land * (1. - ice);
        o += vec3(1., .62, .28) * city * smoothstep(.05, -.25, ndl) * 2.2 * uNight;
        float fr = pow(1. - max(dot(n, v), 0.), 3.); o = mix(o, vec3(.32, .58, 1.) * (lit + .02), fr * .65);
        gl_FragColor = vec4(o, 1.); }` });
  const cloud = new THREE.ShaderMaterial({ uniforms: uni, transparent: true, depthWrite: false,
    vertexShader: surf.vertexShader,
    fragmentShader: `${LOGF[0]}\n${NOISE}\nuniform vec3 uSun; uniform float uTime; varying vec3 vP; varying vec3 vN; varying vec3 vW;
      void main(){ ${LOGF[1]} vec3 p = normalize(vP); float a = smoothstep(.52, .74, fbm(p * 3.4 + vec3(uTime * .004, 0., uTime * .003), 7));
        float lit = smoothstep(-.1, .35, dot(normalize(vN), uSun)); gl_FragColor = vec4(vec3(1.) * (lit * 1.25 + .01), a * .85); }` });
  const atmo = new THREE.ShaderMaterial({ uniforms: uni, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide,
    vertexShader: surf.vertexShader,
    fragmentShader: `${LOGF[0]}\nuniform vec3 uSun; varying vec3 vP; varying vec3 vN; varying vec3 vW;
      void main(){ ${LOGF[1]} vec3 n = normalize(vN), v = normalize(cameraPosition - vW); float rim = pow(max(0., 1. + dot(n, v) * 1.0), 0.6);
        float k = pow(clamp(1. - abs(dot(n, v)), 0., 1.), 4.); float lit = smoothstep(-.35, .4, dot(n, uSun));
        gl_FragColor = vec4(vec3(.3, .55, 1.) * k * lit * 1.8, 1.); }` });
  return { uni, surf, cloud, atmo };
}
function makeEarth(radius, oct = 9) {
  const m = earthMaterials(); m.uni.uOct.value = oct;
  const g = new THREE.Group();
  const s = new THREE.Mesh(new THREE.SphereGeometry(1, 256, 128), m.surf); s.scale.setScalar(radius); g.add(s);
  const c = new THREE.Mesh(new THREE.SphereGeometry(1, 192, 96), m.cloud); c.scale.setScalar(radius * 1.006); g.add(c);
  const a = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 64), m.atmo); a.scale.setScalar(radius * 1.05); g.add(a);
  g.userData = { mats: m, surf: s, cloud: c };
  return g;
}

// ---------- stars + sun (follow the camera) ----------
const sky = new THREE.Group(); scene.add(sky);
const softDot = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,255,.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(c); return t; })();
const stars = (() => { const n = 7000, R = rng(3), pos = new Float32Array(n * 3), col = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const u = R() * 2 - 1, a = R() * 6.283, s = Math.sqrt(1 - u * u); pos.set([s * Math.cos(a) * 1e5, u * 1e5, s * Math.sin(a) * 1e5], i * 3); const b = .5 + R() * .8, w = R(); col.set([b * (w < .2 ? 1 : .85), b * .9, b * (w > .8 ? 1 : .85)], i * 3); } const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); return new THREE.Points(g, new THREE.PointsMaterial({ size: RES > 720 ? 2.2 : 1.6, sizeAttenuation: false, vertexColors: true, map: softDot, transparent: true, depthWrite: false })); })();
sky.add(stars);
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: new THREE.Color(6, 5.6, 4.8), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); sunSprite.scale.setScalar(5000); sky.add(sunSprite);
const sun = new THREE.DirectionalLight(0xFFF4E2, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0004; scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xBFDFFF, 0x2A3440, .5); scene.add(hemi);

// ---------- materials ----------
const M = o => new THREE.MeshStandardMaterial(o);
const mat = {
  white: M({ color: 0xE9EDF2, roughness: .45, metalness: .1 }), steel: M({ color: 0x8C949E, roughness: .4, metalness: .75 }), dark: M({ color: 0x2B2F36, roughness: .6, metalness: .3 }),
  orange: M({ color: 0xE8642C, roughness: .5, metalness: .1 }), yellow: M({ color: 0xF2B632, roughness: .5 }), red: M({ color: 0xD03A30, roughness: .5 }),
  glass: M({ color: 0x10202C, roughness: .08, metalness: .5, emissive: 0x2A1A08, emissiveIntensity: 1 }), pv: M({ color: 0x1A2A55, roughness: .25, metalness: .6, emissive: 0x6FD8FF, emissiveIntensity: 0 }),
  ribbon: M({ color: 0x3A3F48, roughness: .22, metalness: .85, side: THREE.DoubleSide }), deck: M({ color: 0x5A6068, roughness: .8, metalness: .3 }),
  laser: new THREE.MeshBasicMaterial({ color: new THREE.Color(.6, 3.2, 2.2), transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false }),
};
function mesh(geo, m, parent, cast = true) { const me = new THREE.Mesh(geo, m); me.castShadow = cast; me.receiveShadow = true; parent.add(me); return me; }
function box(w, h, d, m, x, y, z, parent) { const me = mesh(new THREE.BoxGeometry(w, h, d), m, parent); me.position.set(x, y, z); return me; }
function cyl(r0, r1, h, m, parent, seg = 24) { return mesh(new THREE.CylinderGeometry(r0, r1, h, seg), m, parent); }
function beam(a, b, r, m, parent) { const d = new THREE.Vector3().subVectors(b, a); const me = cyl(r, r, d.length(), m, parent, 8); me.position.copy(a).addScaledVector(d, .5); me.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize()); return me; }

// ---------- the climber (metres) ----------
function makeClimber() {
  const g = new THREE.Group();
  const body = mesh(new RoundedBoxGeometry(5, 6.4, 4, 3, .45), mat.white, g); body.position.set(0, 0, -3.1);
  box(5.1, .6, 4.1, mat.orange, 0, 1.6, -3.1, g); box(5.1, .25, 4.1, mat.orange, 0, -2.4, -3.1, g);
  [[-1.2, .4], [1.2, .4], [-1.2, -1.1], [1.2, -1.1]].forEach(([x, y]) => box(1.5, 1.0, .1, mat.glass, x, y, -1.07, g));
  [-1, 1].forEach(s => { box(.5, .5, 2.6, mat.steel, s * 1.2, 2.6, -1.4, g); box(.5, .5, 2.6, mat.steel, s * 1.2, -2.6, -1.4, g); });
  [2.6, -2.6].forEach(y => [-.42, .42].forEach(z => { const r = cyl(.38, .38, 2.4, mat.dark, g); r.rotation.z = Math.PI / 2; r.position.set(0, y, z); }));
  const pv = mesh(new THREE.CylinderGeometry(3.4, 3.4, .25, 8), mat.pv, g); pv.position.set(0, -3.9, -3.1);
  [[2.6, 3.3, -1.1], [-2.6, 3.3, -1.1]].forEach(([x, y, z]) => { const l = mesh(new THREE.SphereGeometry(.16, 12, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(4, .4, .3) }), g, false); l.position.set(x, y, z); l.userData.blink = true; });
  const antenna = cyl(.05, .05, 2, mat.steel, g); antenna.position.set(1.8, 4.2, -3.1);
  g.userData.pv = pv;
  return g;
}

// ===================== OCEAN SET =====================
const OCEAN = new THREE.Group(); scene.add(OCEAN);
const skyU = { zen: { value: new THREE.Color('#2A6FC9') }, hor: { value: new THREE.Color('#BFE0F2') }, sunDir: { value: V3(-.4, .55, -.73).normalize() }, sunCol: { value: new THREE.Color(1, .92, .78) }, sunAmt: { value: 1 } };
const SKY_FN = `vec3 skyCol(vec3 d){ float h = max(d.y, 0.); vec3 c = mix(hor, zen, pow(h, .45)); float s = max(dot(d, sunDir), 0.);
  c += sunCol * (pow(s, 1800.) * 60. + pow(s, 180.) * 1.2 + pow(s, 6.) * .25) * sunAmt; if (d.y < 0.) c = mix(hor, hor * .6, clamp(-d.y * 3., 0., 1.)); return c; }`;
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(9e5, 64, 32), new THREE.ShaderMaterial({ uniforms: skyU, side: THREE.BackSide, depthWrite: false,
  vertexShader: `${LOGV[0]}\nvarying vec3 vD; void main(){ vD = normalize(position); vec4 w = modelMatrix * vec4(position, 1.); gl_Position = projectionMatrix * viewMatrix * w; ${LOGV[1]} }`,
  fragmentShader: `${LOGF[0]}\nuniform vec3 zen, hor, sunDir, sunCol; uniform float sunAmt; varying vec3 vD; ${SKY_FN} void main(){ ${LOGF[1]} gl_FragColor = vec4(skyCol(normalize(vD)), 1.); }` }));
OCEAN.add(skyDome);
const WAVES = `vec3 waves(vec2 p, float t, out vec3 n){ vec3 o = vec3(0.); vec2 dd = vec2(0.);
  vec4 W[5]; W[0] = vec4(1., .2, 60., 1.1); W[1] = vec4(.7, .7, 31., .6); W[2] = vec4(-.3, 1., 18., .35); W[3] = vec4(.9, -.45, 9., .16); W[4] = vec4(-.6, .8, 4.5, .07);
  for (int i = 0; i < 5; i++) { vec2 dir = normalize(W[i].xy); float k = 6.2831 / W[i].z, a = W[i].w, ph = k * dot(dir, p) - sqrt(9.8 * k) * t;
    o.y += a * sin(ph); o.xz += dir * a * .6 * cos(ph); dd += dir * k * a * cos(ph); }
  n = normalize(vec3(-dd.x, 1., -dd.y)); return o; }`;
function oceanMat(amp = 1) {
  return new THREE.ShaderMaterial({ uniforms: { ...skyU, uTime: U.time, uAmp: { value: amp } },
    vertexShader: `${LOGV[0]}\nuniform float uTime, uAmp; varying vec3 vW; varying vec3 vN; ${WAVES}
      void main(){ vec4 w = modelMatrix * vec4(position, 1.); vec3 n; vec3 d = waves(w.xz, uTime, n); w.xyz += d * uAmp; vN = normalize(mix(vec3(0,1,0), n, uAmp)); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; ${LOGV[1]} }`,
    fragmentShader: `${LOGF[0]}\nuniform vec3 zen, hor, sunDir, sunCol; uniform float sunAmt; varying vec3 vW; varying vec3 vN; ${SKY_FN}
      void main(){ ${LOGF[1]} vec3 n = normalize(vN), v = normalize(cameraPosition - vW); float f = .02 + .98 * pow(1. - max(dot(n, v), 0.), 5.);
        vec3 r = reflect(-v, n); r.y = abs(r.y); vec3 refl = skyCol(r); vec3 body = mix(vec3(.004, .045, .07), vec3(.01, .12, .16), clamp(vW.y * .4 + .4, 0., 1.)) * (.4 + .6 * sunAmt);
        vec3 c = mix(body, refl, f); float foam = smoothstep(.85, 1.25, vW.y) * .35; c += foam * (.5 + .5 * sunAmt);
        float dist = length(vW.xz - cameraPosition.xz); c = mix(c, hor * .95, smoothstep(2500., 30000., dist)); gl_FragColor = vec4(c, 1.); }` });
}
const seaNear = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600, 320, 320).rotateX(-Math.PI / 2), oceanMat(1)); OCEAN.add(seaNear);
const seaFar = new THREE.Mesh(new THREE.PlaneGeometry(80000, 80000, 64, 64).rotateX(-Math.PI / 2), oceanMat(0)); seaFar.position.y = -.6; OCEAN.add(seaFar);
// clouds (billboards)
const cloudTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const R = rng(8); for (let k = 0; k < 26; k++) { const x = 40 + R() * 176, y = 90 + R() * 90, r = 30 + R() * 50; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); } return new THREE.CanvasTexture(c); })();
const oceanClouds = []; { const R = rng(12); for (let k = 0; k < 16; k++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex, transparent: true, depthWrite: false, fog: false, color: 0xffffff })); const a = R() * 6.28, d = 5000 + R() * 14000; s.position.set(Math.cos(a) * d, 900 + R() * 1400, Math.sin(a) * d); s.scale.set(5000 + R() * 5000, 2200 + R() * 1500, 1); s.userData.storm = k < 4; if (s.userData.storm) { s.position.set(-9000 + k * 1600, 1300, -12000); s.scale.set(9000, 6000, 1); } OCEAN.add(s); oceanClouds.push(s); } }
// the platform
const platform = new THREE.Group(); OCEAN.add(platform);
{
  const p = platform;
  [-28, 28].forEach(z => { box(96, 8, 14, mat.orange, 0, -5, z, p); });
  [[-34, -28], [34, -28], [-34, 28], [34, 28]].forEach(([x, z]) => { const c = cyl(6, 6, 24, mat.orange, p, 32); c.position.set(x, 6, z); cyl(6.2, 6.2, 1, mat.white, p, 32).position.set(x, 17.5, z); });
  box(84, 4, 70, mat.deck, 0, 20, 0, p); box(86, 1.2, 72, mat.white, 0, 22.4, 0, p);
  box(26, 12, 18, mat.white, -24, 29, -18, p); box(14, 8, 14, mat.white, -24, 39, -18, p); for (let k = 0; k < 4; k++) box(24, 1, .2, mat.glass, -24, 26 + k * 2.4, -8.9, p);
  const hp = cyl(11, 11, .6, mat.dark, p, 40); hp.position.set(24, 23.3, -20); const hc = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); g.fillStyle = '#2B2F36'; g.fillRect(0, 0, 256, 256); g.strokeStyle = '#F2B632'; g.lineWidth = 10; g.beginPath(); g.arc(128, 128, 110, 0, 7); g.stroke(); g.fillStyle = '#fff'; g.font = '700 150px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('H', 128, 136); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  const hd = mesh(new THREE.CircleGeometry(10.5, 40), M({ map: hc, roughness: .8 }), p, false); hd.rotation.x = -Math.PI / 2; hd.position.set(24, 23.65, -20);
  // anchor tower
