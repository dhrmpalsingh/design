// ---------- sound cues ----------
const SFX = [];
VO.forEach((l, i) => { if (i > 0) SFX.push([S[i], 'whoosh']); });
SFX.push([T(0, .05), 'sonar'], [T(1, .3), 'splash'], [T(1, .32), 'bubbles'], [T(1, .8), 'thud'], [T(2, .1), 'flood'], [T(2, .2), 'bubbles']);
for (let k = 0; k < 4; k++) SFX.push([T(3, .08 + k * .1), 'clang']);
SFX.push([T(3, .6), 'pump'], [T(4, .12), 'whoosh'], [T(5, .15), 'creak'], [T(5, .45), 'creak'], [T(6, .3), 'chime'], [T(7, .35), 'creak'], [T(8, .35), 'thud'], [T(8, .8), 'thud']);
for (let k = 0; k < 3; k++) SFX.push([T(8, .68 + k * .09), 'clang']);
SFX.push([T(9, .25), 'chime'], [T(10, .1), 'bubbles'], [T(10, .55), 'clang'], [T(10, .66), 'pump'], [T(11, .1), 'hiss'], [T(12, .3), 'pop'], [T(13, .32), 'click'], [T(13, .34), 'hum'], [T(14, .05), 'chime'], [T(15, .62), 'pop']);

  let t0 = performance.now(); const tick = now => { renderAt(((now - t0) / 1000) % VDUR); requestAnimationFrame(tick); }; requestAnimationFrame(tick);
