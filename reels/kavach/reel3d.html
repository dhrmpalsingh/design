<script type="module">
// ---------------------------------------------------------------------------
// How Kavach stops trains from colliding. One night-time railway set (metres):
// three parallel broad-gauge tracks along z (x = -5.3, 0, 5.3), catenary portals,
// trees, a station at z ~ 400 with its Kavach unit, a radio tower, signals S-1 / S-2,
// RFID tag pairs between the rails, and two trains (A: red engine, B: blue engine).
// Each scene is one narration line (vo.js); actions sit at fractions of a scene.
// The map (scene 14), the braking-curve graph, the cab screen and the cards are SVG.
// ---------------------------------------------------------------------------
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
await document.fonts.load('700 60px Fredoka');

const QP = new URLSearchParams(location.search);
const RES = +(QP.get('res') || 720), PXW = RES, PXH = Math.round(RES * 16 / 9);

// ---------- math + timeline ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => b <= a ? (t >= b ? 1 : 0) : clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const VO = window.VO || [];
const S = []; let acc = .35;
VO.forEach(l => { S.push(acc); acc += l.dur + .25 + l.extra; });
const VDUR = acc + .1, SE = i => (i + 1 < S.length ? S[i + 1] : VDUR), T = (i, f = 0) => S[i] + f * (SE(i) - S[i]);
const P = (t, i, a, b) => prog(t, T(i, a), T(i, b));
const fmt = n => Math.round(n).toLocaleString('en-US');

// Distance covered by something moving at v that starts braking at tb and stops at ts (constant deceleration).
const runDist = (t, v, tb, ts) => { if (t <= tb) return v * t; const tau = Math.min(t, ts) - tb; return v * tb + v * tau - v * tau * tau / (2 * (ts - tb)); };
const runSpeed = (t, v, tb, ts) => t <= tb ? v : v * clamp(1 - (t - tb) / (ts - tb));

// ---------- renderer ----------
const canvas = document.getElementById('gl');
canvas.width = PXW; canvas.height = PXH; canvas.style.width = PXW + 'px'; canvas.style.height = PXH + 'px';
{ const st = document.getElementById('stage'), o = document.getElementById('ov'); st.style.width = PXW + 'px'; st.style.height = PXH + 'px'; o.setAttribute('width', PXW); o.setAttribute('height', PXH); }
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(PXW, PXH, false);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), .04).texture;
scene.environmentIntensity = .12;
const FOG = new THREE.Color('#0B1428');
scene.fog = new THREE.FogExp2(FOG, .0028);
const camera = new THREE.PerspectiveCamera(40, PXW / PXH, .1, 2e5);
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(PXW, PXH, { type: THREE.HalfFloatType, samples: 4 }));
composer.setSize(PXW, PXH);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(PXW, PXH), .5, .45, .92); composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- textures ----------
function canvasTex(size, draw, rep) { const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(rep[0], rep[1]); t.anisotropy = 8; return t; }
const softDot = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.2, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const grassTex = canvasTex(512, (g, s) => { const R = rng(2); g.fillStyle = '#1D2A16'; g.fillRect(0, 0, s, s); for (let k = 0; k < 9000; k++) { const v = R(); g.fillStyle = v < .5 ? 'rgba(52,70,34,.5)' : v < .8 ? 'rgba(20,28,14,.6)' : 'rgba(70,72,48,.35)'; g.fillRect(R() * s, R() * s, 2 + R() * 5, 2 + R() * 5); } }, [500, 500]);
const ballastTex = canvasTex(256, (g, s) => { const R = rng(4); g.fillStyle = '#4A4744'; g.fillRect(0, 0, s, s); for (let k = 0; k < 2600; k++) { const c = 50 + R() * 70 | 0; g.fillStyle = `rgb(${c},${c - 3},${c - 6})`; g.beginPath(); g.ellipse(R() * s, R() * s, 2 + R() * 4, 2 + R() * 3, R() * 3, 0, 6.3); g.fill(); } }, [1, 600]);

// ---------- sky, moon, stars ----------
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `varying vec3 vD; void main(){ float h = clamp(vD.y, 0., 1.); vec3 c = mix(vec3(.06,.1,.2), vec3(.012,.02,.055), pow(h, .5)); c += vec3(.12,.1,.12) * exp(-h * 18.) * .6; gl_FragColor = vec4(c, 1.); }` });
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(5e4, 48, 24), skyMat); scene.add(skyDome);
const stars = (() => { const n = 3500, R = rng(3), pos = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const u = .04 + R() * .96, a = R() * 6.283, s = Math.sqrt(1 - u * u); pos.set([s * Math.cos(a) * 4e4, u * 4e4, s * Math.sin(a) * 4e4], i * 3); } const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); return new THREE.Points(g, new THREE.PointsMaterial({ size: RES > 720 ? 2.4 : 1.7, sizeAttenuation: false, color: 0xC8D4FF, map: softDot, transparent: true, depthWrite: false, fog: false })); })();
skyDome.add(stars);
const MOON_DIR = V3(-.35, .42, .84).normalize();
const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: new THREE.Color(3, 3, 3.3), fog: false, depthWrite: false })); moon.scale.setScalar(2600); moon.position.copy(MOON_DIR).multiplyScalar(4e4); skyDome.add(moon);
const moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: new THREE.Color(.25, .3, .5), fog: false, depthWrite: false, blending: THREE.AdditiveBlending })); moonHalo.scale.setScalar(14000); moonHalo.position.copy(moon.position); skyDome.add(moonHalo);
const moonLight = new THREE.DirectionalLight(0x9DB4FF, .55); moonLight.castShadow = true; moonLight.shadow.mapSize.set(2048, 2048); moonLight.shadow.bias = -.0005;
Object.assign(moonLight.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 400 }); scene.add(moonLight, moonLight.target);
const hemi = new THREE.HemisphereLight(0x3A4E80, 0x10140C, .42); scene.add(hemi);

// ---------- materials ----------
const M = o => new THREE.MeshStandardMaterial(o);
const glow = (r, g, b) => new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b) });
const mat = {
  grass: M({ map: grassTex, roughness: 1 }), ballast: M({ map: ballastTex, roughness: .95 }),
  rail: M({ color: 0xB9BEC6, roughness: .22, metalness: .95 }), railSide: M({ color: 0x4A3A30, roughness: .8, metalness: .4 }),
  sleeper: M({ color: 0x8E8A84, roughness: .9 }), mast: M({ color: 0x7C838C, roughness: .5, metalness: .7 }), wire: M({ color: 0x6E5A44, roughness: .4, metalness: .8 }),
  red: M({ color: 0xB51E26, roughness: .35, metalness: .3 }), blue: M({ color: 0x1D4FA6, roughness: .35, metalness: .3 }), cream: M({ color: 0xE8DCC0, roughness: .45, metalness: .1 }),
  roof: M({ color: 0x3A3D42, roughness: .6, metalness: .5 }), dark: M({ color: 0x1E2126, roughness: .7, metalness: .4 }), steel: M({ color: 0x8C949E, roughness: .4, metalness: .75 }),
  glass: M({ color: 0x0A141C, roughness: .05, metalness: .6 }), coach: M({ color: 0x7A2228, roughness: .4, metalness: .3 }), coachBand: M({ color: 0xD9CDB0, roughness: .5 }),
  window: M({ color: 0x221A10, emissive: 0xFFC77A, emissiveIntensity: 1.6, roughness: .3 }),
  concrete: M({ color: 0x6E6C68, roughness: .9 }), plaster: M({ color: 0xC9B48E, roughness: .85 }), trunk: M({ color: 0x2A2016, roughness: 1 }), leaf: M({ color: 0x14240F, roughness: 1 }),
  cabinet: M({ color: 0xC9CED6, roughness: .45, metalness: .3 }), yellow: M({ color: 0xF2B632, roughness: .5 }), black: M({ color: 0x111316, roughness: .6 }),
  lampOn: glow(5, 4.2, 3), headlamp: glow(5, 5, 4.4), tail: glow(6, .3, .25),
};
function mesh(geo, m, parent, cast = true) { const me = new THREE.Mesh(geo, m); me.castShadow = cast; me.receiveShadow = true; parent.add(me); return me; }
function box(w, h, d, m, x, y, z, parent, cast = true) { const me = mesh(new THREE.BoxGeometry(w, h, d), m, parent, cast); me.position.set(x, y, z); return me; }
function cyl(r0, r1, h, m, parent, seg = 16) { return mesh(new THREE.CylinderGeometry(r0, r1, h, seg), m, parent); }
function beam(a, b, r, m, parent) { const d = new THREE.Vector3().subVectors(b, a); const me = cyl(r, r, d.length(), m, parent, 6); me.position.copy(a).addScaledVector(d, .5); me.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize()); return me; }
const tm = new THREE.Matrix4(), tp = new THREE.Vector3(), tq = new THREE.Quaternion(), ts = new THREE.Vector3();

// ===================== WORLD =====================
const WORLD = new THREE.Group(); scene.add(WORLD);
const ZMIN = -1500, ZMAX = 1500, ZLEN = ZMAX - ZMIN, TRACKS = [-5.3, 0, 5.3], GAUGE = 1.676, RAIL_Y = .42;
const ground = mesh(new THREE.PlaneGeometry(8000, 8000).rotateX(-Math.PI / 2), mat.grass, WORLD, false);
TRACKS.forEach(x => {
  const b = mesh(new THREE.BoxGeometry(4.2, .24, ZLEN), mat.ballast, WORLD, false); b.position.set(x, .12, 0);
  [-1, 1].forEach(s => { box(.08, .16, ZLEN, mat.rail, x + s * GAUGE / 2, RAIL_Y - .08, 0, WORLD, false); box(.16, .04, ZLEN, mat.railSide, x + s * GAUGE / 2, RAIL_Y - .18, 0, WORLD, false); });
});
{ const n = Math.floor(ZLEN / .65), sl = new THREE.InstancedMesh(new THREE.BoxGeometry(2.75, .14, .26), mat.sleeper, n * TRACKS.length); let k = 0;
  TRACKS.forEach(x => { for (let i = 0; i < n; i++) { tm.makeTranslation(x, .28, ZMIN + i * .65); sl.setMatrixAt(k++, tm); } }); sl.receiveShadow = true; WORLD.add(sl); }
// catenary portals every 60 m, contact wires over every track
{ const portal = new THREE.Group(); box(.35, 8.6, .35, mat.mast, -9, 4.3, 0, portal); box(.35, 8.6, .35, mat.mast, 9, 4.3, 0, portal); box(18.4, .4, .3, mat.mast, 0, 8.3, 0, portal);
  TRACKS.forEach(x => { box(.06, 2.0, .06, mat.mast, x, 7.2, 0, portal, false); box(.5, .12, .12, mat.mast, x, 6.25, 0, portal, false); });
  const parts = []; portal.traverse(o => o.isMesh && parts.push(o));
  parts.forEach(p => { const n = Math.floor(ZLEN / 60), im = new THREE.InstancedMesh(p.geometry, p.material, n); for (let i = 0; i < n; i++) { tm.makeTranslation(p.position.x, p.position.y, ZMIN + 30 + i * 60); im.setMatrixAt(i, tm); } im.castShadow = true; WORLD.add(im); });
  TRACKS.forEach(x => { box(.035, .035, ZLEN, mat.wire, x, 6.2, 0, WORLD, false); box(.03, .03, ZLEN, mat.wire, x, 7.6, 0, WORLD, false); }); }
// trees
{ const R = rng(9), n = 2200, trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(.18, .28, 4, 6), mat.trunk, n), crowns = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.6, 1), mat.leaf, n);
  for (let i = 0; i < n; i++) { const side = R() < .5 ? -1 : 1, x = side * (16 + Math.pow(R(), 1.6) * 420), z = ZMIN + R() * ZLEN, s = .7 + R() * .9;
    if (x > 12 && x < 40 && z > 220 && z < 640) continue; // keep the station yard clear
    tm.compose(tp.set(x, 2 * s, z), tq.identity(), ts.set(s, s, s)); trunks.setMatrixAt(i, tm);
    tm.compose(tp.set(x, (4 + 1.6) * s, z), tq.setFromAxisAngle(V3(0, 1, 0), R() * 6), ts.set(s * (1 + R() * .4), s * (.8 + R() * .5), s * (1 + R() * .4))); crowns.setMatrixAt(i, tm); }
  crowns.castShadow = true; WORLD.add(trunks, crowns); }
// distant village lights
{ const R = rng(21), n = 160, pos = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const a = R() * 6.283, d = 900 + R() * 1600; pos.set([Math.cos(a) * d, 2 + R() * 6, Math.sin(a) * d], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  WORLD.add(new THREE.Points(g, new THREE.PointsMaterial({ size: RES > 720 ? 6 : 4, sizeAttenuation: false, color: new THREE.Color(2.2, 1.5, .8), map: softDot, transparent: true, depthWrite: false, fog: false }))); }

// ---------- RFID tags: a pair every 200 m on the main track, plus one at each signal ----------
const TAG_Z = []; for (let z = -1400; z <= 1400; z += 200) TAG_Z.push(z); TAG_Z.push(300 - 30, 520 - 30);
const tagMat = M({ color: 0xF2B632, roughness: .4, emissive: 0xFFB020, emissiveIntensity: 0 });
const tagGlowMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(1, .7, .1), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
const TAGS = [];
TAG_Z.forEach(z => [0, 3].forEach(dz => { const g = new THREE.Group(); g.position.set(0, .31, z + dz); box(.5, .07, .32, tagMat, 0, 0, 0, g, false); box(.32, .075, .14, mat.black, 0, .005, 0, g, false);
  const h = mesh(new THREE.PlaneGeometry(1.4, 1.4).rotateX(-Math.PI / 2), tagGlowMat, g, false); h.position.y = .05; WORLD.add(g); TAGS.push(g); }));

// ---------- signals ----------
function makeSignal() {
  const g = new THREE.Group(); cyl(.12, .14, 6, mat.mast, g).position.y = 3; box(.9, .18, .9, mat.concrete, 0, .09, 0, g);
  box(.6, 1.7, .4, mat.black, 0, 5.4, 0, g); box(1.0, .06, .4, mat.black, 0, 6.3, 0, g);
  const lamps = [[0, 1.0, .3], [1, .75, .1], [1, .1, .08]].map(([r, gg, b], k) => { const l = mesh(new THREE.CircleGeometry(.17, 20), new THREE.MeshBasicMaterial({ color: new THREE.Color(r * .08, gg * .08, b * .08) }), g, false); l.position.set(0, 5.95 - k * .52, .21); l.userData.on = new THREE.Color(r * 7, gg * 7, b * 7); l.userData.off = l.material.color.clone(); return l; });
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); halo.scale.setScalar(3); g.add(halo);
  g.userData = { lamps, halo, set(aspect) { lamps.forEach((l, k) => l.material.color.copy(k === aspect ? l.userData.on : l.userData.off)); halo.position.copy(lamps[aspect].position).setZ(.4); halo.material.color.copy(lamps[aspect].userData.on).multiplyScalar(.16); } };
  return g;
}
const SIG1 = makeSignal(), SIG2 = makeSignal();
SIG1.position.set(-2.4, 0, 300); SIG2.position.set(-2.4, 0, 520); SIG1.rotation.y = SIG2.rotation.y = Math.PI; // facing trains coming from -z
SIG1.userData.set(0); SIG2.userData.set(2); WORLD.add(SIG1, SIG2);

// ---------- station (z 300..560 on the +x side) ----------
const STATION = new THREE.Group(); WORLD.add(STATION);
box(5.6, 1.0, 260, mat.concrete, 9.9, .5, 430, STATION); box(.25, .04, 260, mat.yellow, 7.35, 1.02, 430, STATION, false);
{ const b = new THREE.Group(); b.position.set(18, 0, 430); STATION.add(b);
  box(9, 5.5, 34, mat.plaster, 0, 2.75, 0, b); box(10.4, .5, 36, mat.roof, 0, 5.75, 0, b);
  for (let k = 0; k < 7; k++) box(.1, 1.6, 2.2, mat.window, -4.52, 2.6, -13.5 + k * 4.5, b, false);
  const board = box(.15, 1.1, 9, M({ color: 0xF2C230, roughness: .5, emissive: 0x3A2A00 }), -4.6, 4.4, 0, b, false); }
for (let k = 0; k < 8; k++) { cyl(.12, .12, 4.4, mat.mast, STATION).position.set(11.6, 3.2, 340 + k * 26); }
box(5.6, .25, 200, mat.roof, 10.2, 5.5, 430, STATION);
const stationLamps = []; for (let k = 0; k < 5; k++) { const l = new THREE.PointLight(0xFFC98A, 260, 40, 1.8); l.position.set(9.5, 5.0, 350 + k * 40); STATION.add(l); stationLamps.push(l); const bulb = mesh(new THREE.BoxGeometry(.3, .08, 1.6), mat.lampOn, STATION, false); bulb.position.set(9.5, 5.3, 350 + k * 40); }
// the station Kavach cabinet, beside the building
const CAB = new THREE.Group(); CAB.position.set(12.4, 1.0, 470); STATION.add(CAB);
box(1.3, 2.1, .8, mat.cabinet, 0, 1.05, 0, CAB); const cabLed = box(.9, .12, .02, glow(.3, 1.6, 3), 0, 1.75, -.42, CAB, false);
for (let k = 0; k < 4; k++) box(.12, .12, .02, glow(k === 2 ? 3 : .3, k === 2 ? .2 : 2.5, .4), -.35 + k * .23, 1.45, -.42, CAB, false);
// cables from the cabinet to each signal (thin lines in a trench)
const cableMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(.3, 1.6, 3), transparent: true, opacity: 0 });
const cables = [SIG1, SIG2].map(sig => { const g = new THREE.Group(); const a = V3(12.4, 1.1, 470), b = V3(sig.position.x, .5, sig.position.z), m1 = V3(7, .35, 470), m2 = V3(-2.4, .35, 470);
  [[a, V3(12.4, .35, 470)], [V3(12.4, .35, 470), m1], [m1, m2], [m2, V3(-2.4, .35, sig.position.z)], [V3(-2.4, .35, sig.position.z), b]].forEach(([p, q]) => beam(p, q, .06, cableMat, g)); WORLD.add(g); return g; });

// ---------- radio tower ----------
const TOWER = new THREE.Group(); TOWER.position.set(30, 0, 400); WORLD.add(TOWER);
{ const H = 42, legs = [[-1, -1], [1, -1], [1, 1], [-1, 1]], w = y => lerp(2.6, .5, y / H);
  legs.forEach(([a, b]) => beam(V3(a * w(0), 0, b * w(0)), V3(a * w(H), H, b * w(H)), .1, mat.mast, TOWER));
  for (let y = 0; y < H - 1; y += 3.5) for (let k = 0; k < 4; k++) { const [a1, b1] = legs[k], [a2, b2] = legs[(k + 1) % 4]; beam(V3(a1 * w(y), y, b1 * w(y)), V3(a2 * w(y + 3.5), y + 3.5, b2 * w(y + 3.5)), .045, mat.mast, TOWER); beam(V3(a1 * w(y), y, b1 * w(y)), V3(a2 * w(y), y, b2 * w(y)), .04, mat.mast, TOWER); }
  [0, 1.6, 3.2, 4.8].forEach(a => { const p = box(.5, 1.6, .2, mat.cream, Math.cos(a) * .8, H - 2, Math.sin(a) * .8, TOWER); p.rotation.y = -a; });
  cyl(.04, .04, 4, mat.mast, TOWER).position.y = H + 2;
  const av = mesh(new THREE.SphereGeometry(.22, 12, 8), mat.tail, TOWER, false); av.position.y = H + 4.1; TOWER.userData.beacon = av;
  box(2.4, 2.4, 3, mat.cabinet, 4, 1.2, 0, TOWER); }
const ringMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(.4, 1.8, 3.2), transparent: true, opacity: .0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false });
