// What if the Sun disappeared? A 3D explainer in sets: SOLAR (the Sun, the light

// ---------------------------------------------------------------------------

// ---------- math + timeline ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

const backOut = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

const VO = window.VO || [];
const S = []; let acc = .35;

const VDUR = acc + .1, SE = i => (i + 1 < S.length ? S[i + 1] : VDUR), T = (i, f = 0) => S[i] + f * (SE(i) - S[i]);

// ---------- renderer ----------
const canvas = document.getElementById('gl');

{ const st = document.getElementById('stage'), o = document.getElementById('ov'); st.style.width = PXW + 'px'; st.style.height = PXH + 'px'; o.setAttribute('width', PXW); o.setAttribute('height', PXH); }

const U = { time: { value: 0 } };

// ---------- shared GLSL ----------
const NOISE = `
float h3(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
float vn(vec3 x) { vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }

const LOGV = ['#include <common>\n#include <logdepthbuf_pars_vertex>\n', '\n#include <logdepthbuf_vertex>\n'];

const SUN_SPACE = V3(-.55, .25, .8).normalize();

// ---------- procedural Earth (shared by SPACE, ASCENT and CABIN) ----------
function earthMaterials() {
  const uni = { uSun: { value: SUN_SPACE.clone() }, uTime: U.time, uNight: { value: 1 }, uOct: { value: 9 }, uFreeze: { value: 0 }, uLight: { value: 1 } };
  const surf = new THREE.ShaderMaterial({ uniforms: uni,
    vertexShader: `${LOGV[0]}\nvarying vec3 vP; varying vec3 vN; varying vec3 vW;
      void main(){ vP = position; vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; ${LOGV[1]} }`,
    fragmentShader: `${LOGF[0]}\n${NOISE}\nuniform vec3 uSun; uniform float uNight, uFreeze, uLight; uniform int uOct; varying vec3 vP; varying vec3 vN; varying vec3 vW;
      void main(){ ${LOGF[1]}
        vec3 p = normalize(vP); float c = fbm(p * 1.7 + vec3(3.1, 1.2, 7.7), uOct); float land = smoothstep(.505, .513, c);
        float lat = abs(p.x); float d2 = fbm(p * 6. + 11., 6);
        vec3 ocean = mix(vec3(.008, .05, .16), vec3(.025, .17, .34), smoothstep(.36, .505, c));
        vec3 green = mix(vec3(.09, .18, .07), vec3(.25, .3, .12), d2);
        float dry = smoothstep(.45, .66, fbm(p * 3. + 5., 5)) * (1. - smoothstep(.25, .6, lat));
        vec3 lc = mix(green, vec3(.55, .45, .28), dry); lc = mix(lc, vec3(.38, .35, .32), smoothstep(.6, .7, c));
        vec3 col = mix(ocean, lc, land); col = mix(col, mix(vec3(.62, .72, .84), vec3(.9, .93, .98), land), uFreeze);
        float ice = smoothstep(.8, .86, lat + (d2 - .5) * .1); col = mix(col, vec3(.88, .92, .98), ice);
        vec3 n = normalize(vN), v = normalize(cameraPosition - vW); float ndl = dot(n, uSun);
        float lit = smoothstep(-.06, .3, ndl) * uLight; vec3 o = col * (lit * 1.35 + .012 + .045 * (1. - uLight));
        vec3 hh = normalize(uSun + v); o += vec3(1., .93, .8) * pow(max(dot(n, hh), 0.), 70.) * (1. - land) * (1. - ice) * lit * .9;
        float city = step(.8, vn(p * 300.)) * step(.55, vn(p * 45.)) * land * (1. - ice);

    vertexShader: surf.vertexShader,
    fragmentShader: `${LOGF[0]}\n${NOISE}\nuniform vec3 uSun; uniform float uTime, uFreeze, uLight; varying vec3 vP; varying vec3 vN; varying vec3 vW;
      void main(){ ${LOGF[1]} vec3 p = normalize(vP); float a = smoothstep(.52, .74, fbm(p * 3.4 + vec3(uTime * .004, 0., uTime * .003), 7)) * (1. - uFreeze * .85);
        float lit = smoothstep(-.1, .35, dot(normalize(vN), uSun)) * uLight; gl_FragColor = vec4(vec3(1.) * (lit * 1.25 + .01), a * .85); }` });

    vertexShader: surf.vertexShader,
    fragmentShader: `${LOGF[0]}\nuniform vec3 uSun; uniform float uLight; varying vec3 vP; varying vec3 vN; varying vec3 vW;
      void main(){ ${LOGF[1]} vec3 n = normalize(vN), v = normalize(cameraPosition - vW); float rim = pow(max(0., 1. + dot(n, v) * 1.0), 0.6);

  const a = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 64), m.atmo); a.scale.setScalar(radius * 1.05); g.add(a);
  g.userData = { mats: m, surf: s, cloud: c };
  return g;
}

// ---------- stars + sun (follow the camera) ----------

const stars = (() => { const n = 7000, R = rng(3), pos = new Float32Array(n * 3), col = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const u = R() * 2 - 1, a = R() * 6.283, s = Math.sqrt(1 - u * u); pos.set([s * Math.cos(a) * 1e5, u * 1e5, s * Math.sin(a) * 1e5], i * 3); const b = .5 + R() * .8, w = R(); col.set([b * (w < .2 ? 1 : .85), b * .9, b * (w > .8 ? 1 : .85)], i * 3); } const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); return new THREE.Points(g, new THREE.PointsMaterial({ size: RES > 720 ? 2.2 : 1.6, sizeAttenuation: false, vertexColors: true, map: softDot, transparent: true, depthWrite: false })); })();

const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: new THREE.Color(6, 5.6, 4.8), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); sunSprite.scale.setScalar(5000); sky.add(sunSprite);
const sun = new THREE.DirectionalLight(0xFFF4E2, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0004; scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xBFDFFF, 0x2A3440, .5); scene.add(hemi);

// ---------- materials ----------
const M = o => new THREE.MeshStandardMaterial(o);
const mat = {
  white: M({ color: 0xE9EDF2, roughness: .45, metalness: .1 }), steel: M({ color: 0x8C949E, roughness: .4, metalness: .75 }), dark: M({ color: 0x2B2F36, roughness: .6, metalness: .3 }),
  orange: M({ color: 0xE8642C, roughness: .5, metalness: .1 }), yellow: M({ color: 0xF2B632, roughness: .5 }), red: M({ color: 0xD03A30, roughness: .5 }),
  glass: M({ color: 0x10202C, roughness: .08, metalness: .5, emissive: 0x2A1A08, emissiveIntensity: 1 }), pv: M({ color: 0x1A2A55, roughness: .25, metalness: .6, emissive: 0x6FD8FF, emissiveIntensity: 0 }),
  ribbon: M({ color: 0x3A3F48, roughness: .22, metalness: .85, side: THREE.DoubleSide }), deck: M({ color: 0x5A6068, roughness: .8, metalness: .3 }),
  laser: new THREE.MeshBasicMaterial({ color: new THREE.Color(.6, 3.2, 2.2), transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false }),

function mesh(geo, m, parent, cast = true) { const me = new THREE.Mesh(geo, m); me.castShadow = cast; me.receiveShadow = true; parent.add(me); return me; }
function box(w, h, d, m, x, y, z, parent) { const me = mesh(new THREE.BoxGeometry(w, h, d), m, parent); me.position.set(x, y, z); return me; }

// ===================== shared bits =====================
function personFig(col, skin, hair) {
  const g = new THREE.Group(); const legG = new THREE.CapsuleGeometry(.075, .55, 4, 10);
  const l1 = mesh(legG, M({ color: 0x343B4F, roughness: .8 }), g); l1.position.set(-.09, .36, 0); const l2 = l1.clone(); l2.position.x = .09; g.add(l2);
  const b = mesh(new THREE.CapsuleGeometry(.2, .42, 4, 12), M({ color: col, roughness: .85 }), g); b.position.y = 1.0;
  const hd = mesh(new THREE.SphereGeometry(.15, 20, 14), M({ color: skin, roughness: .7 }), g); hd.position.y = 1.5;
  const hr = mesh(new THREE.SphereGeometry(.155, 20, 14, 0, Math.PI * 2, 0, Math.PI * .5), M({ color: hair, roughness: .9 }), g); hr.position.y = 1.52;
  const a1 = mesh(new THREE.CapsuleGeometry(.06, .45, 4, 8), M({ color: col, roughness: .85 }), g); a1.position.set(-.26, 1, 0); a1.rotation.z = .12; const a2 = a1.clone(); a2.position.x = .26; a2.rotation.z = -.12; g.add(a2);

}
function blobGeo(r, sd, amt = .25, detail = 3, squash = 1) {
  let g = new THREE.IcosahedronGeometry(r, detail); g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g);
  const p = g.attributes.position, v = V3(0, 0, 0);
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); v.multiplyScalar(1 + amt * Math.sin(v.x / r * 2.1 + sd) * Math.sin(v.y / r * 2.7 + sd * 1.7) * Math.sin(v.z / r * 2.3 + sd * .6)); v.y *= squash; p.setXYZ(i, v.x, v.y, v.z); }

}
const starMat = stars.material; starMat.opacity = 1;

// ===================== SOLAR SET (Sun at origin, Earth orbit radius 100) =====================
const SOLAR = new THREE.Group(); scene.add(SOLAR);
const AU = 100, ER = 2.2;
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(9, 96, 48), new THREE.ShaderMaterial({ uniforms: { uTime: U.time, uK: { value: 1 } },
  vertexShader: `${LOGV[0]}\nvarying vec3 vP; varying vec3 vN; varying vec3 vW; void main(){ vP = position; vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; ${LOGV[1]} }`,
  fragmentShader: `${LOGF[0]}\n${NOISE}\nuniform float uTime, uK; varying vec3 vP; varying vec3 vN; varying vec3 vW;
    void main(){ ${LOGF[1]} vec3 p = normalize(vP); float g = fbm(p * 9. + vec3(0., uTime * .05, 0.), 6); float spots = smoothstep(.7, .78, fbm(p * 2.2 + 4., 4));
      float mu = max(dot(normalize(vN), normalize(cameraPosition - vW)), 0.); float limb = .35 + .65 * pow(mu, .45);
      vec3 c = vec3(2.6, 1.65, .75) * (.75 + .5 * g) * limb * (1. - spots * .6); gl_FragColor = vec4(c * uK, 1.); }` }));
SOLAR.add(sunMesh);
const corona = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: new THREE.Color(1.4, .95, .45), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); corona.scale.setScalar(34); SOLAR.add(corona);
const flash = new THREE.Mesh(new THREE.RingGeometry(.96, 1, 128), new THREE.MeshBasicMaterial({ color: new THREE.Color(4, 3.2, 2), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide })); SOLAR.add(flash);
const lightShell = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 48), new THREE.ShaderMaterial({ uniforms: { uK: { value: 1 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `${LOGV[0]}\nvarying vec3 vN; varying vec3 vW; void main(){ vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; ${LOGV[1]} }`,
  fragmentShader: `${LOGF[0]}\nuniform float uK; varying vec3 vN; varying vec3 vW; void main(){ ${LOGF[1]} float f = pow(1. - abs(dot(normalize(vN), normalize(cameraPosition - vW))), 6.); gl_FragColor = vec4(vec3(2.2, 1.7, .9) * f * uK, 1.); }` }));
SOLAR.add(lightShell);
const orbitRing = new THREE.Mesh(new THREE.TorusGeometry(AU, .12, 8, 400), new THREE.MeshBasicMaterial({ color: new THREE.Color(.5, .8, 1.4), transparent: true, opacity: .55, depthWrite: false })); orbitRing.rotation.x = Math.PI / 2; SOLAR.add(orbitRing);
const sEarth = makeEarth(ER, 8); SOLAR.add(sEarth);
const sMoon = mesh(new THREE.SphereGeometry(.6, 48, 24), M({ color: 0x9A968E, roughness: .95 }), SOLAR);
const pathLine = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 1.2, .5), transparent: true, opacity: .8, depthWrite: false })); SOLAR.add(pathLine);
const emptyMark = new THREE.Mesh(new THREE.RingGeometry(8.6, 9, 96), new THREE.MeshBasicMaterial({ color: new THREE.Color(.8, .8, .9), transparent: true, opacity: .35, side: THREE.DoubleSide, depthWrite: false })); SOLAR.add(emptyMark);
// spacetime grid: a dent at the Sun that flattens as the gravity front passes
const gridMat = new THREE.ShaderMaterial({ uniforms: { uR: { value: 0 }, uDepth: { value: 18 } }, transparent: true, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: `${LOGV[0]}\nuniform float uR, uDepth; varying vec2 vXZ; varying float vD;
    void main(){ vec3 p = position; float r = length(p.xz); float well = -uDepth * 14. / sqrt(r * r + 196.); float keep = smoothstep(uR - 6., uR + 6., r); if (uR <= 0.) keep = 1.; p.y += well * keep; vXZ = p.xz; vD = r;

  fragmentShader: `${LOGF[0]}\nuniform float uR; varying vec2 vXZ; varying float vD;
    void main(){ ${LOGF[1]} vec2 g = abs(fract(vXZ / 10. - .5) - .5) / fwidth(vXZ / 10.); float line = 1. - min(min(g.x, g.y), 1.); float front = exp(-pow((vD - uR) / 3., 2.)) * step(.1, uR);
      float fade = 1. - smoothstep(130., 200., vD); gl_FragColor = vec4(vec3(.25, .55, 1.) * line * .9 + vec3(1.5, 1.1, .5) * front * .8, (line * .55 + front * .6) * fade); }` });
const grid = new THREE.Mesh(new THREE.PlaneGeometry(420, 420, 200, 200).rotateX(-Math.PI / 2), gridMat); grid.position.y = -6; SOLAR.add(grid);
// rogue-planet extras: a Milky Way band and distant dark worlds
const milky = (() => { const n = 22000, R = rng(44), pos = new Float32Array(n * 3), col = new Float32Array(n * 3); const ax = V3(.85, .1, -.5).normalize(), b1 = V3(0, 1, .2).normalize(), b2 = new THREE.Vector3().crossVectors(ax, b1).normalize();
  for (let i = 0; i < n; i++) { const a = R() * 6.283, off = (R() + R() + R() - 1.5) * .12; const d = b1.clone().multiplyScalar(Math.cos(a)).addScaledVector(b2, Math.sin(a)).addScaledVector(ax, off).normalize().multiplyScalar(9e4); pos.set([d.x, d.y, d.z], i * 3); const k = .4 + R() * .7; col.set([k, k * .92, k * (R() < .3 ? 1.1 : .85)], i * 3); }

const milkyGlow = (() => { const ax = V3(.85, .1, -.5).normalize(); const m = new THREE.Mesh(new THREE.TorusGeometry(8.5e4, 6500, 16, 128), new THREE.MeshBasicMaterial({ color: new THREE.Color(.1, .095, .13), transparent: true, opacity: .2, depthWrite: false, blending: THREE.AdditiveBlending })); m.quaternion.setFromUnitVectors(V3(0, 0, 1), ax); return m; })(); sky.add(milkyGlow);
const rogues = [[-60, 20, -220, 3], [80, -30, -300, 4], [-140, -50, -380, 5]].map(([x, y, z, r]) => { const m = mesh(new THREE.SphereGeometry(r, 48, 24), M({ color: 0x2A2E36, roughness: .9, emissive: 0x0A1020, emissiveIntensity: .6 }), SOLAR, false); m.position.set(x, y, z); return m; });

// ===================== COAST SET (metres) =====================
