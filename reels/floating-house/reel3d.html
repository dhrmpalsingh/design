<script type="module">
// ---------------------------------------------------------------------------
// Floating House, 3D version. Same story and timing as reel.html (shared through
// timeline.js); the world is built in Three.js and rendered with real lighting,
// shadows and translucent water. 2D layout units convert to metres: 60 px = 1 m.
// ---------------------------------------------------------------------------
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
const QP = new URLSearchParams(location.search);
const RES = +(QP.get('res') || 720), K = RES / 720, PXW = Math.round(720 * K), PXH = Math.round(1280 * K);
const USE_AO = QP.get('ao') !== '0';

await document.fonts.load('700 60px Fredoka');
const TL = window.TL;
const X = px => (px - 360) / 60, Y = py => (600 - py) / 60;
const PIT = { x0: -4, x1: 4, z0: -6, z1: 0, bot: -8 };
const BED_Y = Y(1160);

// ---------- renderer ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
canvas.width = PXW; canvas.height = PXH;
renderer.setSize(PXW, PXH, false);
{ const st = document.getElementById('stage'), o = document.getElementById('ov'); st.style.width = PXW + 'px'; st.style.height = PXH + 'px'; o.setAttribute('width', PXW); o.setAttribute('height', PXH); canvas.style.width = PXW + 'px'; canvas.style.height = PXH + 'px'; }
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.62;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.fog = new THREE.Fog(0xcfe2ee, 45, 140);
const camera = new THREE.PerspectiveCamera(30, 720 / 1280, 0.1, 600);

// ---------- procedural textures ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function canvasTex(w, h, draw, repeat = [1, 1], srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat);
  t.anisotropy = 8;
  return t;
}
function speckle(g, w, h, n, cols, rmin, rmax, R) {
  for (let i = 0; i < n; i++) { g.fillStyle = cols[Math.floor(R() * cols.length)]; g.globalAlpha = .25 + R() * .5; g.beginPath(); g.arc(R() * w, R() * h, rmin + R() * (rmax - rmin), 0, 7); g.fill(); }
  g.globalAlpha = 1;
}
const texGrass = canvasTex(512, 512, (g, w, h) => {
  const R = rng(1); g.fillStyle = '#5f9a3e'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 5000, ['#4f8a33', '#6fae48', '#7dbb52', '#4a7f2e', '#86c25c'], .6, 2.4, R);
  for (let i = 0; i < 2500; i++) { g.strokeStyle = ['#3f7a2a', '#8cc861', '#5c9b3c'][i % 3]; g.globalAlpha = .5; const x = R() * w, y = R() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - .5) * 3, y - 3 - R() * 5); g.stroke(); }
}, [30, 18]);
const texDirt = canvasTex(512, 512, (g, w, h) => {
  const R = rng(2); g.fillStyle = '#7b5032'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 4000, ['#6a432a', '#8c5d3c', '#5e3b24', '#9a6a46'], .8, 3.5, R);
  speckle(g, w, h, 160, ['#a58466', '#8a7a6a', '#6f6358'], 2, 6, R);
}, [3, 3]);
const texConcrete = canvasTex(512, 512, (g, w, h) => {
  const R = rng(3); g.fillStyle = '#b7b4ad'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 6000, ['#a9a69f', '#c4c1ba', '#9d9a93', '#cfccc5'], .5, 2, R);
  g.strokeStyle = 'rgba(80,80,80,.18)'; g.lineWidth = 2; for (let y = 0; y < h; y += 128) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  g.fillStyle = 'rgba(70,70,70,.35)'; for (let x = 32; x < w; x += 128) for (let y = 64; y < h; y += 128) { g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); }
}, [2, 1]);
const texPlaster = canvasTex(512, 512, (g, w, h) => {
  const R = rng(4); g.fillStyle = '#efe5d3'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 5000, ['#e6dbc8', '#f6eee0', '#e0d4bf'], .5, 1.6, R);
}, [2, 2]);
const texWood = canvasTex(512, 512, (g, w, h) => {
  const R = rng(5);
  for (let y = 0; y < h; y += 32) {
    for (let x = -(y * 7 % 200); x < w; x += 200) {
      g.fillStyle = ['#b98a5a', '#a87b4d', '#c49564', '#ad8152'][Math.floor(R() * 4)]; g.fillRect(x, y, 200, 32);
      g.strokeStyle = 'rgba(70,40,20,.5)'; g.lineWidth = 2; g.strokeRect(x, y, 200, 32);
      g.strokeStyle = 'rgba(90,55,30,.25)'; g.lineWidth = 1; for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(x, y + 6 + k * 6 + R() * 3); g.bezierCurveTo(x + 60, y + 4 + k * 6, x + 140, y + 10 + k * 6, x + 200, y + 6 + k * 6); g.stroke(); }
    }
  }
}, [2, 2]);
const texRoof = canvasTex(512, 512, (g, w, h) => {
  const R = rng(6); g.fillStyle = '#3f4f63'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) for (let x = (y / 32) % 2 ? -32 : 0; x < w; x += 64) {
    const c = 58 + R() * 22; g.fillStyle = `rgb(${c},${c + 16},${c + 34})`; g.fillRect(x + 2, y + 2, 60, 28);
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x + 2, y + 24, 60, 6);
  }
}, [3, 3]);
const texBrick = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#d8cfc4'; g.fillRect(0, 0, w, h); const R = rng(7);
  for (let y = 0; y < h; y += 32) for (let x = (y / 32) % 2 ? -32 : 0; x < w; x += 64) { g.fillStyle = ['#b5654a', '#a4573f', '#c06f52'][Math.floor(R() * 3)]; g.fillRect(x + 3, y + 3, 58, 26); }
}, [1, 1]);
const texShutter = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#d8723e'; g.fillRect(0, 0, w, h);
  for (let y = 8; y < h; y += 16) { g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(6, y, w - 12, 5); g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(6, y - 3, w - 12, 3); }
  g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
});
const texPicture = canvasTex(256, 192, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#9fd0e8'); gr.addColorStop(1, '#e8f3f8'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = '#f2c14e'; g.beginPath(); g.arc(190, 50, 20, 0, 7); g.fill();
  g.fillStyle = '#5f9a5e'; g.beginPath(); g.moveTo(0, h); g.lineTo(80, 90); g.lineTo(140, 140); g.lineTo(190, 100); g.lineTo(w, h); g.fill();
});
// the ground cross-section (front cut face): x -40..40 m, y 0..-16 m
const SEC = { x0: -40, x1: 40, y0: 0, y1: -26 };
const secU = x => (x - SEC.x0) / (SEC.x1 - SEC.x0), secV = y => (y - SEC.y1) / (SEC.y0 - SEC.y1);
const texSection = canvasTex(4096, 1664, (g, w, h) => {
  const R = rng(8), px = x => (x - SEC.x0) / (SEC.x1 - SEC.x0) * w, py = y => (SEC.y0 - y) / (SEC.y0 - SEC.y1) * h;
  const wav = (x, a, f, ph) => a * Math.sin(x * f + ph) + a * .5 * Math.sin(x * f * 2.7 + ph * 1.3);
  const band = (yTop, yBot, col, aT, aB, ph) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, py(yTop)); for (let X = 0; X <= w; X += 16) { const x = SEC.x0 + X / w * 80; g.lineTo(X, py(yTop + wav(x, aT, .45, ph))); } for (let X = w; X >= 0; X -= 16) { const x = SEC.x0 + X / w * 80; g.lineTo(X, py(yBot + wav(x, aB, .4, ph + 2))); } g.closePath(); g.fill(); };
  g.fillStyle = '#9e6a43'; g.fillRect(0, 0, w, h);
  band(0, -1.3, '#6e4a2e', 0, .12, 1);
  band(-1.3, -4.5, '#a8714a', .12, .2, 3);
  band(-4.5, -7.2, '#9a6440', .2, .25, 5);
  band(-7.2, BED_Y, '#8a5a3a', .25, .18, 7);
  band(BED_Y, SEC.y1, '#77747a', .18, 0, 9);
  speckle(g, w, py(BED_Y), 26000, ['#8b5a37', '#b47f55', '#7a4d30', '#c08a5e'], .8, 2.6, R);
  for (let i = 0; i < 900; i++) { const x = R() * w, y = py(-1.5) + R() * (py(BED_Y) - py(-1.5)); g.fillStyle = ['#b9a48c', '#8f8478', '#a59a8e', '#cdbba3'][i % 4]; g.globalAlpha = .9; g.beginPath(); g.ellipse(x, y, 3 + R() * 7, 2 + R() * 5, R() * 3, 0, 7); g.fill(); }
  g.globalAlpha = 1;
  for (let i = 0; i < 160; i++) { const x = R() * w; g.strokeStyle = 'rgba(60,40,25,.5)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, py(-.05)); let yy = py(-.05); for (let k = 0; k < 5; k++) { yy += 6 + R() * 10; g.lineTo(x + (R() - .5) * 14, yy); } g.stroke(); }
  speckle(g, w, h, 0, [], 0, 0, R);
  for (let i = 0; i < 22000; i++) { const x = R() * w, y = py(BED_Y) + R() * (h - py(BED_Y)); g.fillStyle = ['#6a676d', '#85828a', '#5f5c62', '#918e95'][i % 4]; g.globalAlpha = .5; g.fillRect(x, y, 2 + R() * 4, 2 + R() * 4); }
  g.globalAlpha = 1;
  for (let i = 0; i < 60; i++) { let x = R() * w, y = py(BED_Y) + 20 + R() * (h - py(BED_Y) - 40); g.strokeStyle = 'rgba(40,38,44,.6)'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 4; k++) { x += (R() - .5) * 30; y += 8 + R() * 16; g.lineTo(x, y); } g.stroke(); }
  g.fillStyle = 'rgba(255,255,255,.55)'; g.font = '700 46px Fredoka'; g.fillText('BEDROCK', px(-9.2), py(BED_Y - .9));
  g.fillStyle = '#4f8a33'; g.fillRect(0, 0, w, py(-.12));
});
function textSprite(str, size = 64, col = '#fff') {
  const c = document.createElement('canvas'); const g = c.getContext('2d'); g.font = `700 ${size}px Fredoka`;
  const w = Math.ceil(g.measureText(str).width) + 40; c.width = w; c.height = size * 1.6;
  g.font = `700 ${size}px Fredoka`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = size * .18; g.strokeStyle = '#232026'; g.strokeText(str, w / 2, c.height / 2); g.fillStyle = col; g.fillText(str, w / 2, c.height / 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
  s.scale.set(w / c.height * .6, .6, 1); s.renderOrder = 20; return s;
}

// ---------- materials ----------
const M = (o) => new THREE.MeshStandardMaterial(o);
const mat = {
  grass: M({ map: texGrass, roughness: 1 }),
  dirt: M({ map: texDirt, roughness: 1 }),
  section: M({ map: texSection, roughness: 1 }),
  concrete: M({ map: texConcrete, roughness: .92 }),
  concreteIn: M({ map: texConcrete, color: 0xe4e2dc, roughness: .95 }),
  plaster: M({ map: texPlaster, color: 0xf3e6cf, roughness: .95 }),
  roomDown: M({ color: 0xe9dcc6, roughness: .9 }),
  roomUp: M({ color: 0xd3e1ea, roughness: .9 }),
  wood: M({ map: texWood, roughness: .65 }),
  roof: M({ map: texRoof, roughness: .75 }),
  brick: M({ map: texBrick, roughness: .9 }),
  trim: M({ color: 0xffffff, roughness: .5 }),
  shutter: M({ map: texShutter, roughness: .6 }),
  door: M({ color: 0xd8723e, roughness: .55 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfe3f2, roughness: .05, metalness: 0, transparent: true, opacity: .35, envMapIntensity: 1.6 }),
  steel: M({ color: 0xb4bcc6, metalness: .85, roughness: .32 }),
  steelDark: M({ color: 0x737c86, metalness: .8, roughness: .4 }),
  ring: M({ color: 0xf2c230, metalness: .35, roughness: .35 }),
  cable: M({ color: 0x2a2a2e, metalness: .5, roughness: .5 }),
  sofa: M({ color: 0xd9784a, roughness: .85 }),
  fabric: M({ color: 0x7486c4, roughness: .9 }),
  white: M({ color: 0xf4f2ee, roughness: .8 }),
  darkWood: M({ color: 0x7a5236, roughness: .6 }),
  lampShade: M({ color: 0xfbe3a2, roughness: .6, emissive: 0xffc860, emissiveIntensity: .35 }),
  skin: M({ color: 0xe9b48f, roughness: .7 }),
  pants: M({ color: 0x343b4f, roughness: .8 }),
  leaf: M({ color: 0x5c9a4c, roughness: .9 }),
  leaf2: M({ color: 0x4d8a42, roughness: .9 }),
  trunk: M({ color: 0x6e4e36, roughness: .95 }),
  fence: M({ color: 0xd9bb8e, roughness: .85 }),
  pump: M({ color: 0x2f7fc1, roughness: .4, metalness: .3 }),
  pipeBlue: M({ color: 0x3b82c4, roughness: .4 }),
  pipeYellow: M({ color: 0xf2b632, roughness: .45 }),
  pipeBrown: M({ color: 0x8a6a4e, roughness: .6 }),
  water: new THREE.MeshPhysicalMaterial({ color: 0x2f9fd2, roughness: .08, metalness: 0, transparent: true, opacity: .7, envMapIntensity: .35, depthWrite: false, side: THREE.FrontSide }),
  waterTop: new THREE.MeshPhysicalMaterial({ color: 0x3f98cc, roughness: .04, metalness: 0, transparent: true, opacity: .55, envMapIntensity: .9, depthWrite: false, clearcoat: 1, clearcoatRoughness: .05 }),
  drop: M({ color: 0xd8f1fc, roughness: .1, transparent: true, opacity: .85 }),
  spark: M({ color: 0xffe27a, emissive: 0xffc030, emissiveIntensity: 2 }),
  dust: M({ color: 0xe3e0d8, roughness: 1, transparent: true, opacity: .7 }),
  red: M({ color: 0xe2574c, emissive: 0x7a1d17, emissiveIntensity: .6, roughness: .5 }),
  blue: M({ color: 0x2f7fc1, emissive: 0x0d2f52, emissiveIntensity: .6, roughness: .5 }),
};
const clothes = [0xe2574c, 0x3d7dd8, 0xf2b632, 0x6bbf59].map(c => M({ color: c, roughness: .85 }));

function box(w, h, d, m, x = 0, y = 0, z = 0, parent) {
  const me = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); me.position.set(x, y, z);
  me.castShadow = me.receiveShadow = true; if (parent) parent.add(me); return me;
}
function cyl(r, h, m, parent, seg = 20) { const me = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), m); me.castShadow = me.receiveShadow = true; if (parent) parent.add(me); return me; }

// ---------- sky, lights ----------
const skyCanvas = document.createElement('canvas'); skyCanvas.width = 4; skyCanvas.height = 512;
const skyTex = new THREE.CanvasTexture(skyCanvas); skyTex.colorSpace = THREE.SRGBColorSpace; skyTex.mapping = THREE.EquirectangularReflectionMapping;
scene.background = skyTex;
function paintSky(sm) {
  const g = skyCanvas.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 512);
  const c = (a, b) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * sm)).join(',')})`;
  gr.addColorStop(0, c([52, 120, 200], [62, 70, 80])); gr.addColorStop(.32, c([110, 170, 225], [92, 100, 110]));
  gr.addColorStop(.47, c([205, 228, 242], [128, 136, 142])); gr.addColorStop(.5, c([215, 232, 240], [120, 126, 130])); gr.addColorStop(1, c([120, 140, 120], [70, 74, 72]));
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512); skyTex.needsUpdate = true;
}
let skyState = -1;
const sun = new THREE.DirectionalLight(0xfff0dc, 3.2);
sun.castShadow = true; sun.shadow.mapSize.set(K > 1 ? 4096 : 2048, K > 1 ? 4096 : 2048);
Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 1, far: 80 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = .03; sun.shadow.radius = 3;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x7a5a40, .9); scene.add(hemi);

// ---------- ground ----------
function shapeRect(x0, y0, x1, y1) { const s = new THREE.Shape(); s.moveTo(x0, y0); s.lineTo(x1, y0); s.lineTo(x1, y1); s.lineTo(x0, y1); s.lineTo(x0, y0); return s; }
function holeRect(x0, y0, x1, y1) { const p = new THREE.Path(); p.moveTo(x0, y0); p.lineTo(x0, y1); p.lineTo(x1, y1); p.lineTo(x1, y0); p.lineTo(x0, y0); return p; }
{ // grass top with a hole for the pit
  const s = shapeRect(-60, 0, 60, 90); s.holes.push(holeRect(PIT.x0, -PIT.z1, PIT.x1, -PIT.z0));
  const g = new THREE.ShapeGeometry(s); g.rotateX(-Math.PI / 2); // shape y -> world -z, facing up
  const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 4, uv.getY(i) / 4);
  const me = new THREE.Mesh(g, mat.grass); me.receiveShadow = true; scene.add(me);
  texGrass.repeat.set(1, 1);
}
{ // front cross-section with the pit cut out
  const s = shapeRect(SEC.x0, SEC.y1, SEC.x1, SEC.y0); s.holes.push(holeRect(PIT.x0, PIT.bot, PIT.x1, 0));
  const g = new THREE.ShapeGeometry(s, 4), p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, secU(p.getX(i)), secV(p.getY(i)));
  const me = new THREE.Mesh(g, mat.section); me.receiveShadow = true; scene.add(me);
}
// the undug soil inside the pit's front face (shrinks as the pit is dug)
const patchGeo = new THREE.PlaneGeometry(1, 1);
const patch = new THREE.Mesh(patchGeo, mat.section); patch.receiveShadow = true; scene.add(patch);
function setPatch(yTop) {
  const p = patchGeo.attributes.position, uv = patchGeo.attributes.uv;
  const pts = [[PIT.x0, yTop], [PIT.x1, yTop], [PIT.x0, PIT.bot], [PIT.x1, PIT.bot]];
  pts.forEach(([x, y], i) => { p.setXYZ(i, x, y, 0); uv.setXY(i, secU(x), secV(y)); });
  p.needsUpdate = uv.needsUpdate = true; patchGeo.computeBoundingSphere();
}
// below the pit and behind everything
box(80, 8, 0.2, mat.section, 0, -12, -0.15, scene);
const pitWalls = new THREE.Group(); scene.add(pitWalls);
const wallL = box(.1, 1, 6, mat.dirt, PIT.x0 - .05, -.5, -3, pitWalls), wallR = box(.1, 1, 6, mat.dirt, PIT.x1 + .05, -.5, -3, pitWalls), wallB = box(8, 1, .1, mat.dirt, 0, -.5, PIT.z0 - .05, pitWalls);
const pitFloor = box(8, .1, 6, mat.dirt, 0, -.05, -3, scene);
const pitFloorGrass = box(8, .02, 6, M({ map: texGrass.clone(), roughness: 1 }), 0, -.01, -3, scene);
pitFloorGrass.material.map.repeat.set(2, 1.5); pitFloorGrass.material.map.needsUpdate = true;

  for (let i = 0; i < 9; i++) { const y = 380 + R() * 420, ph = ((t * .9) + R()) % 1, x = -200 + ph * 1100; s += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} q60 -18 120 0 q30 10 40 -6" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity="${(on * Math.sin(Math.PI * ph) * .8).toFixed(2)}"/>`; }

const VIG = `<defs><radialGradient id="gVig" cx=".5" cy=".5" r=".75"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient></defs><rect width="720" height="1280" fill="url(#gVig)"/>`;
function renderAt(t) {
  t = clamp(t, 0, TL.VDUR - 1e-4);
  const st = update(t);
  if (composer) composer.render(); else renderer.render(scene, camera);

}
window.renderAt = renderAt;
window.DUR = TL.VDUR;
window.cues = TL.cues;

const params = new URLSearchParams(location.search);
window.ready = document.fonts.load('700 60px Fredoka').then(() => document.fonts.ready).then(() => {
  if (params.has('render')) { document.body.classList.add('render'); renderAt(+params.get('t') || 0); return; }
  const stage = document.getElementById('stage');
  const fit = () => { const k = Math.min(innerWidth / PXW, (innerHeight - 40) / PXH); stage.style.transform = `scale(${k})`; };
  addEventListener('resize', fit); fit();
  let playing = true, t0 = performance.now(), cur = 0;
  const tick = now => { if (playing) { cur = ((now - t0) / 1000) % TL.VDUR; renderAt(cur); } requestAnimationFrame(tick); };
  const toggle = () => { playing = !playing; t0 = performance.now() - cur * 1000; };
  stage.addEventListener('click', toggle);
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { cur = clamp(cur + (e.code === 'ArrowRight' ? 1 : -1), 0, TL.VDUR - .01); t0 = performance.now() - cur * 1000; renderAt(cur); }
  });
  requestAnimationFrame(tick);
});
